{key:'zeus',name:'宙斯',latin:'Zeus',domains:'天空・雷電・秩序',intro:'奧林帕斯眾神之王，\n掌管天空、雷電與秩序。\n以雷霆象徵權威，\n維護神與人之間的法則。',tone:'#52617b'},
{key:'hera',name:'赫拉',latin:'Hera',domains:'婚姻・家庭・王權',intro:'天后赫拉，\n守護婚姻與家庭。\n她象徵尊嚴與王權，\n也是奧林帕斯的重要女神。',tone:'#70546e'},
{key:'poseidon',name:'波賽頓',latin:'Poseidon',domains:'海洋・地震・風暴',intro:'掌管遼闊海洋的神明，\n以三叉戟掀起波浪。\n他也與地震、風暴相關，\n象徵海洋的強大力量。',tone:'#326b82'},
